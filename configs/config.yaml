# hydra config
hydra:
  run:
    dir: ${train.log_path} # the log path, used for log and checkpoint
  sweep:
    dir: logs/
    subdir: ${train.experiment}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweeper:
    params:
      model.fuse_method: pose_atn
      model.fusion_layers: 0, 1, 2, 3, 4, 5
      model.backbone: 3dcnn

loss:
  lr: 0.0001
  beta1: 0.5 # decapture 
  beta2: 0.999 # decapture

  selection: ["cls", "attn_loss", "bg", "tmp"] # the loss selection for the total loss

  lambda_list: [0.25, 0.5, 0.75, 1.0] # the lambda list for the total loss 
  w_bg: 0.2 # the weight of background class for the loss function, used for cross validation with different class number
  w_temp: 0.05 # the weight of temporal smoothness for the loss function, used for cross validation with different class number
  class_weights: null # per-class weights for the cls cross-entropy, e.g. [1.0, 2.0, 4.0] for ASD/DHS/LCS_HipOA; null = unweighted


data:
  root_path: /mnt/data/xchen/asd_data

  info_path: ${data.root_path}/pose_attn_map_dataset # this is the root path of dataset.
  video_path: ${data.root_path}/segmentation_dataset_512

  data_info_path: ${data.info_path}/json_mix # defined gait cycle json path. This path uesd be gait cycle defined dataset.
  skeleton_path: ${data.info_path}/seg_skeleton_pkl # skeleton path, this used for cross validation, with different class number.
  doctor_results_path: ${data.info_path}/doctor_result # doctor results path, this used for cross validation, with different class number.
  index_mapping: ${data.info_path}/index_mapping # training mapping path, this used for cross validation, with different class number.

  num_workers: 16
  img_size: 224
  sampling: "over" # over, under, none
  heldout_test: False # clean protocol: patient-grouped train/val/TEST (true held-out, no magic_move, holdout not over-sampled). Builds a separate *_heldout fold cache.

  batch_size: 16 # this used for default method, without gait cycle defined method.

model:
  backbone: 3dcnn # choices=[3dcnn, 2dcnn, cnn_lstm, two_stream], help='the backbone of the model'
  backbone_net: slow_r50 # 3D-CNN family: slow_r50 (default) | x3d_m (backbone-generality study #4 / alt published baseline #5)
  model_class_num: 3 # the class num of model. 2 > [ASD, non_ASD]. 3 > [ASD, DHS, LCS_HipOA]. 4 > [ASD, DHS, LCS_HipOA, normal]
  model_depth: 50 # choices=[50, 101, 152], help='the depth of used model'
  use_side_heads: True # whether to use side heads for intermediate supervision
  gate_init_bias: 2.0 # initial bias for PoseGated gate; 2.0 biases early training toward RGB
  gate_mode: gated # PoseGated fusion op: gated (learned gate, default) | add | fixed — gating-vs-injection ablation (#6)

  fuse_method: pose_atn # add, mul, concat, none, late, avg, cross_atn, se_atn, pose_atn
  fusion_layers: 5 # the fuse layer number of the model (0-4=individual layer, 5=all layers)
  ablation_study: single # choices=[single, multi], help='the ablation study of the model, single means only one layer is used for fusion, multi means multiple layers are used for fusion'
  ckpt_path: checkpoints/SLOW_8x8_R50.pyth # the checkpoint path of the model, used for pre-trained model

train:
  # Training config
  max_epochs: 50 # numer of epochs of training

  # used for val
  clip_duration: 1 # clip duration for the video
  uniform_temporal_subsample_num: 16 # num frame from the clip duration, f or define one gait cycle, we need use whole frames.

  attn_map: True # if use the attention map

  experiment: ${model.backbone}_attn_map_${train.attn_map}_${model.fuse_method}_${model.ablation_study}_${model.fusion_layers} # the experiment name, used for log path

  gpu: 2 # the gpu id for training, used for single gpu training. For multi gpu training, please set the gpu id list in the devices parameter of the Trainer.

  log_path: logs/train/${train.experiment}/${now:%Y-%m-%d}/${now:%H-%M-%S}

  fast_dev_run: False # if use the fast_dev_run
  fold: 3 # the fold number of the cross validation
  fold_idx: -1 # -1: train all folds serially; >=0: train only that fold (used by per-fold PBS array jobs)
